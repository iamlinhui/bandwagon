<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS看板</title>
<style>
  :root {
    --bg: #f5f7fa;
    --bg-2: #eaeef4;
    --card: #ffffff;
    --card-2: #eef2f8;
    --border: #e2e7f0;
    --text: #1f2733;
    --text-dim: #566072;
    --text-mute: #8b94a4;
    --accent: #2f74ff;
    --accent-2: #4f8cff;
    --ok: #1aa06b;
    --warn: #d9800c;
    --bad: #e0413e;
    --off: #98a1b1;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(31,39,51,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: var(--accent-2); }

  /* ---------- Top bar ---------- */
  header.bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(245,247,250,.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header.bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  header.bar .brand .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
    display: grid; place-items: center; font-size: 16px;
  }
  header.bar .spacer { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--text-dim);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--off); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .search {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; width: 200px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px 12px; border-radius: 10px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--text); }
  .btn.sm { padding: 6px 10px; font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { border-color: var(--bad); }
  .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 38px; height: 22px; background: var(--card-2); border: 1px solid var(--border); border-radius: 999px; position: relative; transition: .2s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-mute); transition: .2s; }
  .switch input:checked + .track { background: rgba(79,140,255,.25); border-color: var(--accent); }
  .switch input:checked + .track::after { left: 18px; background: var(--accent); }

  /* ---------- Layout ---------- */
  main { padding: 22px; max-width: 1600px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 16px;
  }
  .empty { text-align: center; color: var(--text-mute); padding: 60px 0; }

  /* ---------- Card ---------- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; cursor: pointer; transition: .18s;
    display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-head .title { font-weight: 700; font-size: 15px; word-break: break-all; }
  .card-head .sub { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
  .status-badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; margin-left: auto;
    border: 1px solid transparent;
  }
  .st-running { color: var(--ok); background: rgba(62,207,142,.12); border-color: rgba(62,207,142,.3); }
  .st-stopped { color: var(--off); background: rgba(107,115,131,.15); }
  .st-suspended, .st-error { color: var(--bad); background: rgba(239,83,80,.12); border-color: rgba(239,83,80,.3); }
  .st-pending { color: var(--warn); background: rgba(245,166,35,.12); border-color: rgba(245,166,35,.3); }

  .ips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ip {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    background: var(--card-2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 7px; color: var(--text-dim);
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12.5px; }
  .kv .k { color: var(--text-mute); }
  .kv .v { color: var(--text-dim); text-align: right; word-break: break-all; }

  /* progress bars */
  .meter { display: flex; flex-direction: column; gap: 5px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
  .meter .lbl .pct { color: var(--text-mute); font-variant-numeric: tabular-nums; }
  .track-bar { height: 7px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
  .track-bar > i { display: block; height: 100%; border-radius: 999px; transition: width .4s ease; }
  .fill-ok { background: var(--ok); }
  .fill-warn { background: var(--warn); }
  .fill-bad { background: var(--bad); }

  .card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-mute); border-top: 1px solid var(--border); padding-top: 10px; }
  .group-tag { font-size: 11px; color: var(--accent-2); background: rgba(79,140,255,.1); padding: 2px 8px; border-radius: 999px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(30,41,59,.45); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; box-shadow: var(--shadow);
  }
  .modal-head { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .modal-head .ttl { font-weight: 700; font-size: 17px; }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .modal-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .close-x { margin-left: auto; background: none; border: none; color: var(--text-mute); font-size: 22px; cursor: pointer; line-height: 1; }

  /* ---------- Login ---------- */
  .login-wrap { position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; background: var(--bg); }
  .login {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 30px; width: 100%; max-width: 360px; box-shadow: var(--shadow);
  }
  .login h2 { margin: 0 0 6px; font-size: 20px; }
  .login p { margin: 0 0 22px; color: var(--text-mute); font-size: 13px; }
  .login input {
    width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 13px; border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 12px;
  }
  .login input:focus { border-color: var(--accent); }
  .login .btn.primary { width: 100%; justify-content: center; padding: 11px; }
  .login .err { color: var(--bad); font-size: 13px; margin: -4px 0 12px; min-height: 18px; }

  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px 20px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px;
    opacity: 0; transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--ok); }
  .toast.bad { border-color: var(--bad); }
  @media (max-width: 600px) { header.bar { padding: 12px; } main { padding: 14px; } .search { width: 130px; } }
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-wrap" id="loginWrap" style="display:none">
  <form class="login" id="loginForm">
    <h2 id="loginTitle">VPS看板</h2>
    <p>请输入访问密码以查看机器面板</p>
    <input type="password" id="loginPwd" placeholder="访问密码" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit">登录</button>
  </form>
</div>

<!-- App -->
<div id="app" style="display:none">
  <header class="bar">
    <div class="brand"><span class="logo">🚂</span><span id="brandTitle">VPS看板</span></div>
    <div class="chips" id="chips"></div>
    <div class="spacer"></div>
    <input class="search" id="search" type="search" placeholder="搜索 名称 / IP / 节点…">
    <label class="switch" title="自动刷新">
      <input type="checkbox" id="autoRefresh" checked>
      <span class="track"></span><span>自动刷新</span>
    </label>
    <button class="btn" id="refreshBtn" title="立即刷新">↻ 刷新</button>
    <button class="btn" id="logoutBtn" style="display:none">退出</button>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的机器</div>
  </main>
</div>

<!-- Detail modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <span id="mStatus"></span>
      <div>
        <div class="ttl" id="mTitle">—</div>
        <div style="font-size:12px;color:var(--text-mute)" id="mSub"></div>
      </div>
      <button class="close-x" id="mClose">&times;</button>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot" id="mFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const app = { authed: false, authEnabled: false, pollSec: 60, last: null, timer: null, query: "", auto: true };

/* ---------------- formatters ---------------- */
const fmtBytes = (b) => {
  if (b == null || isNaN(b)) return "—";
  if (b < 1024) return b + " B";
  const u = ["KB","MB","GB","TB","PB"]; let i = -1; let v = b;
  do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
  return v.toFixed(2) + " " + u[i];
};
// "used / total"; falls back to total alone when the used figure is unavailable.
const fmtUsedTotal = (u, t) => (u ? fmtBytes(u) + " / " + fmtBytes(t) : fmtBytes(t));
const fmtUptime = (s) => {
  if (!s || s < 0) return "—";
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  if (d > 0) return d + "天 " + h + "小时";
  if (h > 0) return h + "小时 " + m + "分";
  return m + "分";
};
const fmtDate = (ts) => {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return d.toLocaleDateString("zh-CN") + " " + d.toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit"});
};
const esc = (s) => (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (used, total) => (total > 0 ? (used / total * 100) : 0);
const barClass = (p) => p >= 90 ? "fill-bad" : (p >= 75 ? "fill-warn" : "fill-ok");

/* ---------------- api ---------------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch { /* non-json */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || ("HTTP " + res.status));
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show " + (kind || "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = "toast " + (kind || ""); }, 2600);
}

/* ---------------- auth ---------------- */
async function bootstrap() {
  let st;
  try { st = await api("/api/auth/status"); }
  catch (e) { st = { enabled: false, authed: true, poll_seconds: 60, title: "VPS看板" }; }
  app.authEnabled = st.enabled;
  app.pollSec = st.poll_seconds || 60;
  document.title = st.title || "VPS看板";
  $("#brandTitle").textContent = st.title || "VPS看板";
  $("#loginTitle").textContent = st.title || "VPS看板";
  $("#logoutBtn").style.display = st.enabled ? "" : "none";

  if (st.enabled && !st.authed) {
    $("#loginWrap").style.display = "grid";
    $("#app").style.display = "none";
    $("#loginPwd").focus();
  } else {
    app.authed = true;
    $("#loginWrap").style.display = "none";
    $("#app").style.display = "";
    await load();
    schedule();
  }
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pwd = $("#loginPwd").value;
  $("#loginErr").textContent = "";
  try {
    await api("/api/login", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({password: pwd}) });
    bootstrap();
  } catch (err) {
    $("#loginErr").textContent = err.message || "登录失败";
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  try { await api("/api/logout", {method:"POST"}); } catch {}
  $("#loginPwd").value = "";
  bootstrap();
});

/* ---------------- data + render ---------------- */
async function load() {
  let snap;
  try { snap = await api("/api/instances"); }
  catch (err) {
    if (err.status === 401) { app.authed = false; bootstrap(); return; }
    toast("加载失败: " + err.message, "bad");
    schedule();
    return;
  }
  app.last = snap;
  render(snap);
  schedule();
}

function statusBadge(st) {
  const map = {
    running: ["运行中", "st-running"],
    stopped: ["已停止", "st-stopped"],
    suspended: ["已暂停", "st-suspended"],
    error: ["错误", "st-error"],
    pending: ["采集中", "st-pending"],
  };
  const [label, cls] = map[st] || [st || "未知", "st-stopped"];
  return `<span class="status-badge ${cls}">${esc(label)}</span>`;
}

function render(snap) {
  const insts = snap.instances || [];
  // summary chips
  const online = insts.filter(i => i.online).length;
  const errored = insts.filter(i => i.status === "error").length;
  const offline = insts.length - online - errored;
  const totalTrafficUsed = insts.reduce((a, i) => a + (i.traffic_used||0), 0);
  const totalTrafficAll = insts.reduce((a, i) => a + (i.traffic_total||0), 0);
  $("#chips").innerHTML = `
    <span class="chip"><span class="dot ok"></span>在线 ${online}</span>
    <span class="chip"><span class="dot off"></span>离线 ${offline}</span>
    ${errored ? `<span class="chip"><span class="dot bad"></span>错误 ${errored}</span>` : ""}
    <span class="chip">共 ${insts.length} 台</span>
    <span class="chip">流量 ${fmtBytes(totalTrafficUsed)} / ${fmtBytes(totalTrafficAll)}</span>
    <span class="chip" title="数据更新时间">${snap.updated_at ? "更新于 " + fmtDate(snap.updated_at) : '<span class="spinner"></span> 采集中'}</span>
  `;

  // filter
  const q = app.query.trim().toLowerCase();
  const filtered = insts.filter(i => {
    if (!q) return true;
    const hay = [i.name, i.group, i.hostname, i.node_alias, i.location, i.plan, (i.ip_addresses||[]).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  });

  $("#empty").style.display = filtered.length ? "none" : "";
  $("#grid").innerHTML = filtered.map(cardHTML).join("");
}

function cardHTML(i) {
  const tp = pct(i.traffic_used, i.traffic_total);
  const ips = (i.ip_addresses && i.ip_addresses.length) ? i.ip_addresses : ["—"];
  const errLine = i.error ? `<div style="color:var(--bad);font-size:12px;word-break:break-all">⚠ ${esc(i.error)}</div>` : "";
  const group = i.group ? `<span class="group-tag">${esc(i.group)}</span>` : "";
  return `
  <div class="card" data-id="${esc(i.id)}">
    <div class="card-head">
      <div>
        <div class="title">${esc(i.name)}</div>
        <div class="sub">${esc(i.hostname || i.veid)}${i.node_alias ? " · " + esc(i.node_alias) : ""}</div>
      </div>
      ${statusBadge(i.status)}
    </div>
    <div class="ips">${ips.map(ip => `<span class="ip">${esc(ip)}</span>`).join("")}</div>
    ${errLine}
    <div class="meter">
      <div class="lbl"><span>本月流量</span><span class="pct">${tp.toFixed(1)}%</span></div>
      <div class="track-bar"><i class="${barClass(tp)}" style="width:${Math.min(tp,100)}%"></i></div>
      <div class="lbl"><span>${fmtBytes(i.traffic_used)}</span><span class="pct">/ ${fmtBytes(i.traffic_total)}</span></div>
    </div>
    <div class="kv">
      <span class="k">系统</span><span class="v">${esc(i.os || "—")}</span>
      <span class="k">内存/硬盘</span><span class="v">内存 ${fmtUsedTotal(i.ram_used, i.ram_total)} · 硬盘 ${fmtUsedTotal(i.disk_used, i.disk_total)}</span>
      <span class="k">运行时长</span><span class="v">${fmtUptime(i.uptime)}</span>
      <span class="k">流量重置</span><span class="v">${fmtDate(i.traffic_reset)}</span>
    </div>
    <div class="card-foot">
      ${group}
      <span>${i.updated_at ? "更新 " + fmtDate(i.updated_at) : ""}</span>
    </div>
  </div>`;
}

/* ---------------- modal + actions ---------------- */
let modalInst = null;
function openModal(id) {
  const i = (app.last && app.last.instances || []).find(x => x.id === id);
  if (!i) return;
  modalInst = i;
  $("#mStatus").innerHTML = statusBadge(i.status);
  $("#mTitle").textContent = i.name;
  $("#mSub").textContent = [i.hostname, i.veid && "VEID " + i.veid, i.node_alias, i.location].filter(Boolean).join(" · ");

  const tp = pct(i.traffic_used, i.traffic_total);
  const load = (i.load_average || []);
  $("#mBody").innerHTML = `
    ${i.error ? `<div style="color:var(--bad);font-size:13px">⚠ ${esc(i.error)}</div>` : ""}
    <div class="meter">
      <div class="lbl"><span>本月流量</span><span class="pct">${tp.toFixed(1)}%</span></div>
      <div class="track-bar"><i class="${barClass(tp)}" style="width:${Math.min(tp,100)}%"></i></div>
      <div class="lbl"><span>${fmtBytes(i.traffic_used)}</span><span class="pct">/ ${fmtBytes(i.traffic_total)}</span></div>
    </div>
    <div class="kv">
      <span class="k">IP 地址</span><span class="v">${(i.ip_addresses||[]).map(esc).join(", ")||"—"}</span>
      <span class="k">SSH 端口</span><span class="v">${i.ssh_port || "—"}</span>
      <span class="k">操作系统</span><span class="v">${esc(i.os||"—")}</span>
      <span class="k">套餐</span><span class="v">${esc(i.plan||"—")}</span>
      <span class="k">内存</span><span class="v">${fmtUsedTotal(i.ram_used, i.ram_total)}</span>
      <span class="k">Swap</span><span class="v">${fmtBytes(i.swap_total)}</span>
      <span class="k">硬盘</span><span class="v">${fmtUsedTotal(i.disk_used, i.disk_total)}</span>
      <span class="k">节点 / 机房</span><span class="v">${esc([i.node_alias, i.location].filter(Boolean).join(" · ")||"—")}</span>
      <span class="k">运行时长</span><span class="v">${fmtUptime(i.uptime)}</span>
      <span class="k">负载 (1/5/15)</span><span class="v">${load.length ? load.map(x=>Number(x).toFixed(2)).join(" / ") : "—"}</span>
      <span class="k">暂停状态</span><span class="v">${i.suspended ? "是" : "否"}</span>
      <span class="k">流量重置</span><span class="v">${fmtDate(i.traffic_reset)}</span>
    </div>`;

  const canControl = i.status !== "error";
  $("#mFoot").innerHTML = `
    <button class="btn sm" data-act="restart" ${canControl?"":"disabled"}>↻ 重启</button>
    <button class="btn sm" data-act="stop" ${canControl?"":"disabled"}>■ 停止</button>
    <button class="btn primary sm" data-act="start" ${canControl?"":"disabled"}>▶ 启动</button>`;
  $("#mFoot").querySelectorAll("button[data-act]").forEach(b =>
    b.addEventListener("click", () => doAction(i.id, b.dataset.act)));
  $("#overlay").classList.add("show");
}

async function doAction(id, action) {
  const labels = { start: "启动", stop: "停止", restart: "重启", kill: "强制停止" };
  if (action === "stop" && !confirm(`确认要${labels[action]}这台机器吗?`)) return;
  $("#mFoot").querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    await api(`/api/instances/${encodeURIComponent(id)}/action`, {
      method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({action})
    });
    toast(`${labels[action]}指令已发送`, "ok");
    setTimeout(() => { load(); }, 1500);
  } catch (err) {
    toast(`${labels[action]}失败: ${err.message}`, "bad");
    $("#mFoot").querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

$("#grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card && card.dataset.id) openModal(card.dataset.id);
});
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
$("#mClose").addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
function closeModal() { $("#overlay").classList.remove("show"); modalInst = null; }

/* ---------------- polling ---------------- */
// Adaptive: while the store is still on its first pass (snapshot.updated_at
// unset) we re-fetch every 2s so the page settles in seconds; once data is live
// we fall back to the configured interval. It's a self-rescheduling timeout
// chain — load() calls schedule() at the end of each run.
function schedule() {
  if (app.timer) { clearTimeout(app.timer); app.timer = null; }
  if (!app.auto) return;
  const collecting = !(app.last && app.last.updated_at);
  const wait = collecting ? 2000 : Math.max(app.pollSec, 10) * 1000;
  app.timer = setTimeout(load, wait);
}
$("#autoRefresh").addEventListener("change", (e) => { app.auto = e.target.checked; schedule(); });
$("#refreshBtn").addEventListener("click", () => load());
$("#search").addEventListener("input", (e) => { app.query = e.target.value; if (app.last) render(app.last); });

bootstrap();
</script>
</body>
